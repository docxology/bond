# Code Project Configuration
# Inherits workspace settings from root pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-manuscript"
version = "2.5.2"
license = {text = "MIT"}
description = "Fully-tested codebase with numerical optimization and analysis"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
    "bond-api",
    "bond-coordinator",
    "bond-utilities",
]

# Local path dependencies so the compendium can import each package's manuscript,
# the coordinator roster (canonical film metadata), and the frozen protocol.
[tool.uv.sources]
bond-api = { path = "/Users/4d/Documents/GitHub/template/projects/working/bond/bond-api" }
bond-coordinator = { path = "/Users/4d/Documents/GitHub/template/projects/working/bond/bond-coordinator" }
bond-utilities = { path = "/Users/4d/Documents/GitHub/template/projects/working/bond/bond-utilities" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate; live coverage % is tracked in
# docs/_generated/COUNTS.md (do not hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

[tool.mypy]
# `scripts/` inject `src/` onto sys.path at runtime; mypy needs the same hint so
# `uv run mypy src/ scripts/` type-checks the thin orchestrators too.
mypy_path = "src"
warn_unused_ignores = false
warn_redundant_casts = true
warn_unused_configs = true

# This package is the compendium wrapper: unlike the 33 standalone packages, its
# orchestrators run inside the template monorepo pipeline and import
# `infrastructure.*` from it. Those modules are genuinely absent from a
# standalone checkout, so a local mypy run cannot resolve them and reported 18
# import errors that no code change in this package could fix. The monorepo's own
# mypy run is what type-checks that surface.
[[tool.mypy.overrides]]
module = ["infrastructure.*", "src.*", "yaml"]
ignore_missing_imports = true
