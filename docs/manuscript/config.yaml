# bond-manuscript configuration — PROJECT BOND compendium (wrapper manuscript).
# This top-level manuscript imports one chapter per package and a unified
# bibliography. Loaded by infrastructure/rendering and manuscript-variable
# hydration.

paper:
  title: "PROJECT BOND — The Special-Agent Operations Compendium"
  subtitle: "A 33-Package Software Suite Wrapping One Chapter per James Bond Film"
  version: "1.0.0"
  # No static date: the title page renders \today automatically, so the cover
  # always carries the build date rather than a stale fixed value.
  cover:
    image: "assets/project_bond_cover.png"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

rendering:
  cover_height_fraction: 0.62

publication:
  doi: "10.5281/zenodo.21843592" # stable concept DOI; version DOI is recorded below
  doi_status: "published"
  repository_url: "https://github.com/docxology/bond"
  repository_label: "GitHub repository"
  concept_doi: "10.5281/zenodo.21843592"
  version_doi: "10.5281/zenodo.21843802"
  version_record: "https://zenodo.org/records/21843802"

keywords:
  - "software suite"
  - "special agent operations"
  - "James Bond"
  - "reproducible research"
  - "mission protocol"
  - "compendium"

metadata:
  license: "MIT"
  language: "en"
